apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  annotations:
    helm.sh/hook-weight: "-5"
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        envFrom:
          - configMapRef:
              name: mongodb-conf
        ports:
        - containerPort: {{ .Values.mongodb.containerPort }}
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  ports:
  - port: {{ .Values.mongodb.containerPort }}
    targetPort: {{ .Values.mongodb.containerPort }}
  selector:
    app: mongodb
  clusterIP: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-conf
data:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.env.MONGO_INITDB_ROOT_USERNAME }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.env.MONGO_INITDB_ROOT_PASSWORD }}
  MONGO_APP_DATABASE: {{ .Values.mongodb.env.MONGO_APP_DATABASE }}
  MONGO_APP_USERNAME: {{ .Values.mongodb.env.MONGO_APP_USERNAME }}
  MONGO_APP_PASSWORD: {{ .Values.mongodb.env.MONGO_APP_PASSWORD }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-script
data:
  init-app-db.js: |
    db = db.getSiblingDB(process.env.MONGO_APP_DATABASE);
    if (db.getUser(process.env.MONGO_APP_USERNAME) == null) {
      db.createUser({
        user: process.env.MONGO_APP_USERNAME,
        pwd: process.env.MONGO_APP_PASSWORD,
        roles: [{ role: 'readWrite', db: process.env.MONGO_APP_DATABASE }]
      });
      print('mongodb-init-job: user ' + process.env.MONGO_APP_USERNAME + ' created');
    } else {
      print('mongodb-init-job: user ' + process.env.MONGO_APP_USERNAME + ' already exists, skipping');
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init-job
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mongodb-init
          image: mongo:7.0
          envFrom:
            - configMapRef:
                name: mongodb-conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: mongodb-init-script
              mountPath: /scripts
              readOnly: true
          command:
            - bash
            - -c
            - |
              set -e
              MONGO_URI="mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@mongodb:27017/admin"
              until mongosh "$MONGO_URI" --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do
                echo "Waiting for MongoDB to become ready..."
                sleep 5
              done
              mongosh "$MONGO_URI" --quiet --file /scripts/init-app-db.js
      volumes:
        - name: mongodb-init-script
          configMap:
            name: mongodb-init-script
